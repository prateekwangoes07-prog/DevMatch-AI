[project]
name = "devmatch-backend"
version = "0.1.0"
description = "DevMatch AI FastAPI Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[mypy]>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.5"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.5"
]

